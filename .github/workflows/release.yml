name: Build and release Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and publish Windows x64
        shell: pwsh
        run: |
          ./build.ps1 *>&1 | Tee-Object -FilePath build-output.log
      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $exe = "artifacts/VoiceInput-Windows-x64-$version.exe"
          if (!(Test-Path $exe)) { throw 'Missing executable' }
          git archive --format=zip --prefix=VoiceInput/ --output="artifacts/VoiceInput-Source-$version.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item build-output.log artifacts/build-output.log
          $hashes = Get-ChildItem artifacts -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-Windows-x64-${{ steps.assets.outputs.version }}
          path: artifacts/*.*
          if-no-files-found: error
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) { throw "Draft $tag exists; inspect before retrying" }
            Write-Host "$tag is already published; leaving its assets unchanged."
            exit 0
          }
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          $notes = "docs/releases/$env:RELEASE_VERSION.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag @files --draft --target $env:GITHUB_SHA --title "VoiceInput $env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
