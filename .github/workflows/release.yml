name: Build and release Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.assets.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify release recovery logic offline
        shell: pwsh
        run: ./scripts/TestReleasePublication.ps1 *>&1 | Tee-Object -FilePath build-output.log
      - name: Test and publish Windows x64
        shell: pwsh
        run: ./build.ps1 *>&1 | Tee-Object -FilePath build-output.log -Append
      - name: Exercise actual Windows executable without microphone or cloud
        shell: pwsh
        run: ./scripts/WindowsSmoke.ps1 *>&1 | Tee-Object -FilePath build-output.log -Append
      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $exe = "artifacts/VoiceInput-Windows-x64-$version.exe"
          if (!(Test-Path $exe)) { throw 'Missing executable' }
          git archive --format=zip --prefix=VoiceInput/ --output="artifacts/VoiceInput-Source-$version.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item build-output.log artifacts/build-output.log
          $hashes = Get-ChildItem artifacts -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-Windows-x64-${{ steps.assets.outputs.version }}
          path: artifacts/*.*
          if-no-files-found: error
      - name: Preserve offline desktop evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-smoke.json
            windows-smoke.png
            build-output.log
          if-no-files-found: ignore
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VoiceInput-Windows-x64-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish and verify versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/PublishRelease.ps1
