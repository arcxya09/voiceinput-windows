name: Build and release Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_dependency_locks:
        description: Refresh and export NuGet lock files for review (never publishes)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.assets.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify release recovery logic offline
        shell: pwsh
        run: ./scripts/TestReleasePublication.ps1 *>&1 | Tee-Object -FilePath build-output.log
      - name: Test and publish Windows x64
        shell: pwsh
        env:
          REFRESH_DEPENDENCY_LOCKS: ${{ inputs.refresh_dependency_locks }}
        run: ./build.ps1 -UpdateDependencyLocks:($env:REFRESH_DEPENDENCY_LOCKS -eq 'true') *>&1 | Tee-Object -FilePath build-output.log -Append
      - name: Exercise actual Windows executable without microphone or cloud
        shell: pwsh
        run: ./scripts/WindowsSmoke.ps1 *>&1 | Tee-Object -FilePath build-output.log -Append
      - name: Install, launch and uninstall the actual Windows installer
        shell: pwsh
        run: ./scripts/TestInstaller.ps1 *>&1 | Tee-Object -FilePath build-output.log -Append
      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $portable = "artifacts/VoiceInput-Portable-x64-$version.zip"
          $installer = "artifacts/VoiceInput-Setup-$version.exe"
          if (!(Test-Path $portable) -or !(Test-Path $installer)) { throw 'Missing installer or portable WinUI package' }
          git archive --format=zip --prefix=VoiceInput/ --output="artifacts/VoiceInput-Source-$version.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item build-output.log artifacts/build-output.log
          $payloads = @("VoiceInput-Setup-$version.exe", "VoiceInput-Portable-x64-$version.zip", "VoiceInput-Source-$version.zip", 'build-output.log')
          $hashes = $payloads | ForEach-Object {
            $file = Join-Path artifacts $_
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing payload: $_" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $hashes | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-Release-${{ steps.assets.outputs.version }}
          path: |
            artifacts/VoiceInput-Setup-${{ steps.assets.outputs.version }}.exe
            artifacts/VoiceInput-Portable-x64-${{ steps.assets.outputs.version }}.zip
            artifacts/VoiceInput-Source-${{ steps.assets.outputs.version }}.zip
            artifacts/build-output.log
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Preserve generated dependency locks
        if: always() && inputs.refresh_dependency_locks == true
        uses: actions/upload-artifact@v4
        with:
          name: dependency-locks-${{ github.run_id }}
          path: |
            src/**/packages*.lock.json
            tests/packages*.lock.json
          if-no-files-found: error
      - name: Preserve offline desktop evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-*.json
            windows-*.log
            windows-*.png
            installer-*.json
            installer-*.log
            installer-*.png
            build-output.log
          if-no-files-found: ignore
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.refresh_dependency_locks != true
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VoiceInput-Release-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish and verify versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/PublishRelease.ps1
